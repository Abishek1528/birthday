    <linearGradient id="cakeBottom" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="50%" stop-color="#b8824f"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>
    <linearGradient id="cakeMiddle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9ac79"/>
      <stop offset="50%" stop-color="#be8853"/>
